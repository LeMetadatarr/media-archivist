{% extends "base.html" %}
{% block title %}Archive — media_archivist{% endblock %}
{% block page_title %}Archive{% endblock %}
{% block content %}
<div class="card">
  <form class="form-grid" hx-post="{{ root_path }}/ui/archive" hx-target="#archive-result" hx-swap="innerHTML">
    <div class="field">
      <label for="a-url">URL</label>
      <input id="a-url" name="url" required placeholder="https://www.youtube.com/@channel">
    </div>
    <div class="field">
      <label for="a-backend">Backend</label>
      <select id="a-backend" name="backend">
        <option value="youtube">youtube</option>
        <option value="ia">ia</option>
        <option value="music">music</option>
        <option value="bandcamp">bandcamp</option>
        <option value="soundcloud">soundcloud</option>
      </select>
    </div>
    <div class="field">
      <label for="a-require">Require (comma-separated)</label>
      <input id="a-require" name="require" placeholder="keyword1, keyword2">
    </div>
    <div class="field">
      <label for="a-blacklist">Blacklist (comma-separated)</label>
      <input id="a-blacklist" name="blacklist" placeholder="keyword1, keyword2">
    </div>
    <div class="field">
      <label for="a-min-duration">Min duration (seconds)</label>
      <input id="a-min-duration" name="min_duration" type="number" value="-1" placeholder="-1 = no minimum">
      <span style="font-size:0.8rem; color:var(--text-dim)">-1 means no minimum (any duration is kept).</span>
    </div>
    <div class="field">
      <button class="btn" type="submit">Submit</button>
    </div>
  </form>
</div>
<div id="archive-result" style="margin-top: var(--gap);"></div>
{% endblock %}
